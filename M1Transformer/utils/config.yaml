model:
  type: rope               # sin | rope | zero | linear
                            # "linear" runs the sklearn LinearRegression baseline as a
                            # peer model type (no seeds/epochs/checkpoints -- n_seeds and
                            # models_in_parallel are forced to 1, results land under
                            # results/linear/... via the same layout as the transformers).

  n_encoder_layers: 1      # <-- 1 if matching GRU scale
  dim_val: 16              # <-- 16 if matching GRU scale
  dim_feedforward: 64      # only used by rope/t5 (passed as dim_feedforward); sin/zero
                            # derive dim_val*4 internally, which equals this default
  n_heads: 2               # <-- 2 if dim_val=16
  dropout: 0.1
  window_size: 25          # <-- FIXED: was 24, must match your 25-step window

training:
  train_new_models : True
  plot_only: False          # if True, skip training/testing/evaluating entirely and just
                             # 
                             # 
  n_seeds: 10                #
  models_in_parallel: 10      # how many of the n_seeds models to train simultaneously per group;
                              # tune up/down against GPU memory + utilization (nvidia-smi)
  n_datasets: 10              # pilot value; dataset 0 is always the real, untouched split (torres/m1.py)
  learning_rate: 0.001
  n_epochs: 1000               # smoke test: just checking for crashes, not convergence -- restore to 1000 after
  batch_size: 32
  num_workers: 8
  patience: 20             # Torres: early stop, min_delta 1e-4, patience 20
  min_delta: 0.0001

data:
  prediction_time: [6,12]   # 6 = 30min, 12 = 60min
  train_split: 0.8
  use_phases: True         # add background/rising/falling channels to the input window