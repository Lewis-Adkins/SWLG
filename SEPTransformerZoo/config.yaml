model:
  type: linear          # sin | rope | zero | linear | persistence | posner | nn | rnn | autogluon
  n_encoder_layers: 1      
  dim_val: 16              
  dim_feedforward: 64                                
  n_heads: 2               
  dropout: 0.1
  window_size: 25          

training:
  train_new_models : True          
  n_seeds: 10                
  models_in_parallel: 10      
  n_datasets: 10              
  learning_rate: 0.001
  n_epochs: 1000               
  batch_size: 32
  num_workers: 8
  patience: 20             
  min_delta: 0.0001

evaluate:
  true_vs_pred: True

data:
  prediction_time: [6,12]   
  train_split: 0.8
  use_phases: True  

admin:
  python314_path: ""
  python312_path: ""   
  data_folder_path: "data"
